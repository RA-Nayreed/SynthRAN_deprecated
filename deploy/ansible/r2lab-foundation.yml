---
- name: Validate the physical foundation boundary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require the selected R2Lab foundation inputs
      ansible.builtin.assert:
        that:
          - core == "open5gs"
          - ran == "srsRAN"
          - core_node_name in ["sopnode-f1", "sopnode-f2", "sopnode-f3", "sopnode-w3"]
          - ran_node_name in ["sopnode-f1", "sopnode-f2", "sopnode-f3", "sopnode-w3"]
          - core_node_name != ran_node_name
          - rru in ["n300", "n320"]
          - not monitoring_enabled | bool
          - not fhi72 | bool
        fail_msg: "unsupported physical foundation inputs"

- name: Normalize inventory booleans after POS
  hosts: localhost,sopnodes
  gather_facts: true
  tasks:
    - name: Normalize reviewed inventory booleans
      ansible.builtin.import_tasks: ../tasks/reload_booleans.yml

- name: Prepare the selected compute nodes
  hosts: sopnodes
  roles:
    - role: setup/common
    - role: setup/netplan
    - role: setup/containerd
    - role: setup/pre_k8s
    - role: setup/k8s/k8s_setup
    - role: setup/optimization/cpu
    - role: setup/ovs

- name: Create the Kubernetes control plane
  hosts: core_node
  roles:
    - role: setup/k8s/cluster_create

- name: Make the control plane schedulable
  hosts: core_node
  become: true
  roles:
    - role: setup/k8s/remove_cp_taint

- name: Join the selected RAN worker
  hosts: k8s_workers
  become: true
  roles:
    - role: setup/k8s/cluster_join
      when: inventory_hostname != core_node_name

- name: Reserve the selected RAN worker for RAN pods
  hosts: core_node
  become: true
  roles:
    - role: setup/k8s/add_taint
      vars:
        target_node: "{{ ran_node_name }}"
      when: bridge_enabled

- name: Install the required Kubernetes networking and storage
  hosts: core_node
  become: true
  roles:
    - role: setup/cni
    - role: setup/storage

- name: Apply the supported RAN-node Kubernetes tuning
  hosts: ran_node
  become: true
  roles:
    - role: setup/k8s/k8s_cpu_tuning

- name: Establish the upstream GRE base from core to RAN
  hosts: core_node
  roles:
    - role: setup/gre_tunnel
      when: bridge_enabled

- name: Establish the upstream GRE base from RAN to core
  hosts: ran_node
  roles:
    - role: setup/gre_tunnel
      when: bridge_enabled
