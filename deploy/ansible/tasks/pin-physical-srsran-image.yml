---
- name: Select the locked physical gNB image
  ansible.builtin.set_fact:
    synthran_physical_gnb_image: >-
      {{ synthran_images.srsran_gnb_physical
         if rru == 'n300'
         else synthran_images.srsran_gnb_physical_n320 }}

- name: Pin the physical gNB image in the upstream chart
  ansible.builtin.lineinfile:
    path: "{{ repo_dest_abs }}/charts/srsran-gnb/templates/deployment.yaml"
    regexp: '^(\s*)image:\s*"\{\{ .Values.image.repository \}\}:\{\{ .Values.image.tag \}\}"\s*$'
    line: '\1image: "{{ synthran_physical_gnb_image }}"'
    backrefs: true

- name: Pin the gNB log-helper image
  ansible.builtin.lineinfile:
    path: "{{ repo_dest_abs }}/charts/srsran-gnb/templates/deployment.yaml"
    regexp: '^(\s*)image:\s*busybox\s*$'
    line: '\1image: "{{ synthran_images.busybox_1_36 }}"'
    backrefs: true

- name: Add current-run ownership to gNB selector labels
  ansible.builtin.blockinfile:
    path: "{{ repo_dest_abs }}/charts/srsran-gnb/templates/_helpers.tpl"
    marker: "{{ '{{' }}/* {mark} SYNTHRAN RUN OWNERSHIP */{{ '}}' }}"
    insertafter: '^\{\{- define "srsran-gnb\.selectorLabels" -\}\}$'
    block: |
      synthran.run/id: {{ '{{' }} .Values.synthranRunId | quote {{ '}}' }}

- name: Add current-run ownership to gNB resource labels
  ansible.builtin.blockinfile:
    path: "{{ repo_dest_abs }}/charts/srsran-gnb/templates/_helpers.tpl"
    marker: "{{ '{{' }}/* {mark} SYNTHRAN RESOURCE OWNERSHIP */{{ '}}' }}"
    insertafter: '^\{\{- define "srsran-gnb\.labels" -\}\}$'
    block: |
      synthran.run/id: {{ '{{' }} .Values.synthranRunId | quote {{ '}}' }}

- name: Bind the selected values to the current run
  ansible.builtin.lineinfile:
    path: "{{ values_file }}"
    regexp: '^synthranRunId:'
    line: 'synthranRunId: "{{ synthran_run_id }}"'
    insertafter: EOF

- name: Verify the locked physical image references
  ansible.builtin.command:
    argv:
      - grep
      - --fixed-strings
      - --quiet
      - --
      - "{{ item }}"
      - "{{ repo_dest_abs }}/charts/srsran-gnb/templates/deployment.yaml"
  loop:
    - "{{ synthran_physical_gnb_image }}"
    - "{{ synthran_images.busybox_1_36 }}"
  changed_when: false
