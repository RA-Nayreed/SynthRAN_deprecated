---
- name: Find selected Open5GS manifests
  ansible.builtin.find:
    paths:
      - "{{ repo_dest }}/mongodb"
      - "{{ repo_dest }}/open5gs"
      - "{{ repo_dest }}/msd/bases/open5gs-base"
    patterns:
      - "*.yaml"
      - "*.yml"
    recurse: true
    file_type: file
  register: synthran_open5gs_manifests

- name: Replace every reviewed mutable Open5GS image reference
  ansible.builtin.replace:
    path: "{{ item.0.path }}"
    regexp: "{{ item.1.old | regex_escape }}"
    replace: "{{ item.1.new }}"
  loop: "{{ query('nested', synthran_open5gs_manifests.files, synthran_open5gs_image_replacements) }}"
  vars:
    synthran_open5gs_image_replacements:
      - old: "ghcr.io/niloysh/open5gs:v2.6.4-aio"
        new: "{{ synthran_images.open5gs }}"
      - old: "ghcr.io/niloysh/open5gs:v2.7.0"
        new: "{{ synthran_images.open5gs_smf }}"
      - old: "r2labuser/mongodb:4.4.4-debian-10-r0"
        new: "{{ synthran_images.open5gs_mongodb }}"
      - old: "busybox:1.32.0"
        new: "{{ synthran_images.busybox_1_32 }}"
  no_log: true

- name: Remove the mutable Open5GS image transformer
  ansible.builtin.replace:
    path: "{{ repo_dest }}/open5gs/kustomization.yaml"
    regexp: '(?ms)^images:\n.*?(?=^patches:)'
    replace: ""

- name: Pin the patched Open5GS AMF image
  ansible.builtin.replace:
    path: "{{ repo_dest }}/open5gs/kustomization.yaml"
    regexp: "r2labuser/open5gs-amf-patched:v2\\.7\\.0"
    replace: "{{ synthran_images.open5gs_amf }}"

- name: Remove the deferred second slice from the runtime graph
  ansible.builtin.lineinfile:
    path: "{{ repo_dest }}/open5gs/slices/kustomization.yaml"
    regexp: '^\s*-\s*slice2\s*$'
    state: absent

- name: Add metadata-only run ownership before Kustomize creates resources
  ansible.builtin.blockinfile:
    path: "{{ item }}/kustomization.yaml"
    marker: "# {mark} SYNTHRAN RUN OWNERSHIP"
    insertafter: EOF
    block: |
      labels:
        - pairs:
            synthran.run/id: "{{ synthran_run_id }}"
          includeSelectors: false
          includeTemplates: false
  loop:
    - "{{ repo_dest }}/mongodb"
    - "{{ repo_dest }}/networks5g"
    - "{{ repo_dest }}/open5gs"

- name: Check that reviewed mutable Open5GS image references are absent
  ansible.builtin.command:
    argv:
      - grep
      - --recursive
      - --fixed-strings
      - --quiet
      - --
      - "{{ item }}"
      - "{{ repo_dest }}/mongodb"
      - "{{ repo_dest }}/open5gs"
      - "{{ repo_dest }}/msd/bases/open5gs-base"
  loop:
    - "ghcr.io/niloysh/open5gs:v2.6.4-aio"
    - "ghcr.io/niloysh/open5gs:v2.7.0"
    - "r2labuser/mongodb:4.4.4-debian-10-r0"
    - "r2labuser/open5gs-amf-patched:v2.7.0"
    - "busybox:1.32.0"
  register: synthran_open5gs_mutable_probe
  changed_when: false
  failed_when: synthran_open5gs_mutable_probe.rc == 0 or synthran_open5gs_mutable_probe.rc > 1
