---
- name: Validate the physical srsRAN boundary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require the selected physical gNB inputs
      ansible.builtin.assert:
        that:
          - core == "open5gs"
          - ran == "srsRAN"
          - rru in ["n300", "n320"]
          - core_node_name != ran_node_name
          - not monitoring_enabled | bool
          - synthran_run_id is match("^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$")
          - synthran_fiveg_ansible_commit is match("^[0-9a-f]{40}$")
        fail_msg: "unsupported physical srsRAN inputs"

- name: Converge the physical srsRAN gNB
  hosts: ran_node
  gather_facts: true
  vars:
    ansible_python_interpreter: /opt/synthran-venv/bin/python
    repo_dest: "{{ ansible_env.HOME }}/.synthran/{{ synthran_run_id }}/srsran-helm"
  pre_tasks:
    - name: Load the reviewed 5G profile
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all/5g_profile_default.yaml"
      no_log: true

  tasks:
    - name: Prepare the upstream physical srsRAN configuration
      ansible.builtin.include_role:
        name: 5g/srsRAN/config
        apply:
          no_log: true

    - name: Apply locked physical image and run ownership
      ansible.builtin.include_tasks: tasks/pin-physical-srsran-image.yml

    - name: Deploy and stabilize the physical gNB through the upstream role
      ansible.builtin.include_role:
        name: 5g/srsRAN/deploy
        tasks_from: deploy_gnb.yml

    - name: Preserve current-run ownership on the gNB Deployment
      ansible.builtin.command:
        argv:
          - kubectl
          - label
          - --namespace
          - open5gs
          - --overwrite
          - deployment/srsran-gnb
          - "synthran.run/id={{ synthran_run_id }}"
      environment:
        KUBECONFIG: /root/.kube/config
      changed_when: true

    - name: Bind the gNB Deployment to the current role authority
      ansible.builtin.command:
        argv:
          - kubectl
          - annotate
          - --namespace
          - open5gs
          - --overwrite
          - deployment/srsran-gnb
          - "synthran.io/run-id={{ synthran_run_id }}"
          - "synthran.io/deployment-authority=fiveg_ansible:{{ synthran_fiveg_ansible_commit }}"
      environment:
        KUBECONFIG: /root/.kube/config
      changed_when: true
