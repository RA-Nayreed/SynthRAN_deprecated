[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthran-lab"
version = "0.0.1"
description = "Reproducible IoT and programmable 5G/Open RAN experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "SynthRAN contributors" }
]
dependencies = []

[project.scripts]
synthran = "synthran.cli:main"

[tool.setuptools.packages.find]
include = ["synthran*"]
