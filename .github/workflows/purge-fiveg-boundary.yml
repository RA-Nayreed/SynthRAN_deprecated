name: Purge fiveg boundary

on:
  pull_request:
    paths:
      - "synthran/**"
      - "deploy/**"
      - "tests/test_fiveg_adapter.py"
      - "tests/test_fiveg_ansible.py"
      - ".github/workflows/purge-fiveg-boundary.yml"
  push:
    branches:
      - purge/thin-fiveg-adapter
    paths:
      - "synthran/**"
      - "deploy/**"
      - "tests/test_fiveg_adapter.py"
      - "tests/test_fiveg_ansible.py"
      - ".github/workflows/purge-fiveg-boundary.yml"

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile upstream-only lifecycle
        run: |
          python -m py_compile \
            synthran/adapters/fiveg.py \
            synthran/amber_experiment_runtime.py \
            synthran/cli.py \
            synthran/experiment/physical.py \
            synthran/fiveg_ansible.py \
            synthran/iot_edge_transport.py \
            synthran/lifecycle.py \
            synthran/network/runtime.py
      - name: Run adapter boundary tests
        run: |
          python -m unittest -v \
            tests.test_fiveg_adapter \
            tests.test_fiveg_ansible
      - name: Prove deleted deployment layers stay deleted
        run: |
          test ! -e synthran/r2lab
          test ! -e synthran/network/resources.py
          test ! -e synthran/upstream_overlay.py
          test ! -e deploy/ansible
          ! grep -R -n 'synthran\.r2lab' synthran
          ! grep -R -n 'synthran\.network\.resources' synthran
          ! grep -R -n 'synthran\.upstream_overlay' synthran
      - name: Prove no local topology support matrix
        run: |
          ! grep -R -n -E 'SUPPORTED_(CORE|RAN|RADIO)' synthran/adapters synthran/fiveg_ansible.py synthran/lifecycle.py synthran/cli.py
          ! grep -R -n 'apply_network_overlay' synthran/adapters synthran/fiveg_ansible.py synthran/lifecycle.py synthran/cli.py
      - name: Prove lifecycle delegates deployment upstream
        run: |
          grep -q 'FiveGAdapter' synthran/lifecycle.py
          ! grep -n -E 'ansible-playbook|worktree add|apply_network_overlay|copytree|execute_resource_preparation|prepare_physical_resources|stage_n3xx_gnb|start_n3xx_gnb|activate_physical_ue' synthran/lifecycle.py synthran/cli.py
      - name: Prove observation layer does not deploy
        run: |
          ! grep -n -E 'ansible-playbook|worktree add|apply_network_overlay|copytree|FiveGAdapter\.up|FiveGAdapter\.down' synthran/network/runtime.py
